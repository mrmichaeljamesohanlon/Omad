name: Regenerate recipe catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate_catalog.py
      - recipes.json

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate catalogue
        run: python generate_catalog.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- recipes-v3.json recipes.json; then
            echo "Catalogue already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes-v3.json recipes.json
          git commit -m "Regenerate schema v3 recipe catalogue"
          git push
